name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Copy env template
        run: cp .env.example .env

      - name: Run ESLint
        run: npm run lint || true

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build Web & Server Bundle
        run: npm run build
