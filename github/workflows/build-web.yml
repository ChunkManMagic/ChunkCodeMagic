name: Build Web App

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Upload Web Artifacts
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci || npm install

    - name: Build Production Assets
      run: npm run build

    - name: Upload Build Output
      uses: actions/upload-artifact@v4
      with:
        name: web-production-build
        path: dist/
        retention-days: 7
        
