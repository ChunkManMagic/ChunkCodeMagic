services:
  - type: web
    name: personaforge
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: GEMINI_API_KEY
        generate: false
      - key: GEMINI_LIVE_API_KEY
        generate: false
      - key: LIVE_ALLOW_MAIN_KEY_FALLBACK
        value: "false"
      - key: API_ACCESS_TOKEN
        generate: false
